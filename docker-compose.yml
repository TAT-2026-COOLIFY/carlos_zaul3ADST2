services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: cadastro-clientes-frontend:latest
    container_name: cadastro-clientes-frontend
    ports:
      - "${PORTA_FRONTEND:-4200}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
